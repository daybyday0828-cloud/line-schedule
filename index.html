<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>日程アンケート</title>
<style>
  :root {
    --green: #06C755;
    --orange: #F5A623;
    --gray: #8C8C8C;
    --bg: #F2F3F5;
    --card: #FFFFFF;
    --text: #1F1F1F;
    --sub: #6B6B6B;
    --border: #E2E3E5;
    --red: #E53935;
    --sat: #1E6FD9;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
    font-size: 15px;
  }
  header {
    position: sticky; top: 0; z-index: 1;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px 10px;
  }
  h1 { font-size: 17px; margin: 0; }
  .sub { display: flex; justify-content: space-between; gap: 8px; margin-top: 4px; font-size: 13px; color: var(--sub); }
  .deadline { color: var(--red); }
  #status { font-size: 12px; color: var(--sub); white-space: nowrap; }
  #status.saving { color: var(--orange); }
  #status.saved { color: var(--green); }
  main { max-width: 560px; margin: 0 auto; padding: 12px 16px 48px; }
  .legend { font-size: 12px; color: var(--sub); margin: 0 0 10px; }
  .row {
    display: flex; align-items: center; gap: 8px;
    background: var(--card);
    border-radius: 12px;
    padding: 8px 10px 8px 14px;
    margin-bottom: 8px;
  }
  .date { flex: 1; font-size: 16px; font-weight: 600; }
  .date.w6 { color: var(--sat); }
  .date.w0 { color: var(--red); }
  .choice {
    width: 54px; height: 44px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    background: #FFFFFF;
    color: #B0B0B0;
    font-size: 22px; line-height: 1;
    cursor: pointer;
    transition: background-color .12s, color .12s, border-color .12s, transform .08s;
  }
  .choice:active { transform: scale(.94); }
  .choice.on { color: #FFFFFF; }
  .choice.on.o { background: var(--green); border-color: var(--green); }
  .choice.on.t { background: var(--orange); border-color: var(--orange); }
  .choice.on.x { background: var(--gray); border-color: var(--gray); }
  .card { background: var(--card); border-radius: 12px; padding: 16px; margin-bottom: 12px; line-height: 1.6; }
  .error { color: var(--red); }
  .toast {
    position: fixed; left: 16px; right: 16px; bottom: 16px;
    background: #323232; color: #FFFFFF;
    border-radius: 10px; padding: 12px 14px; font-size: 14px;
    display: none;
  }
  .toast.show { display: block; }
  .actions { display: flex; flex-direction: column; gap: 8px; margin-top: 20px; }
  .btn {
    width: 100%; padding: 12px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--card);
    font-size: 15px; color: var(--text); cursor: pointer;
  }
  .btn.primary { background: var(--green); border-color: var(--green); color: #FFFFFF; font-weight: 600; }
  .btn.danger { color: var(--red); }
  pre { white-space: pre-wrap; word-break: break-word; font-family: inherit; font-size: 14px; margin: 0; }
  .loading { text-align: center; color: var(--sub); padding: 40px 0; }
</style>
</head>
<body>
<header>
  <h1 id="title">日程アンケート</h1>
  <div class="sub"><span id="meta"></span><span id="status"></span></div>
</header>
<main id="main"><div class="loading">読み込み中…</div></main>
<div class="toast" id="toast"></div>

<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
  // ===== 設定（README の手順に沿って書き換えてください） =====
  const LIFF_ID = '2011878429-LfcJpsP5';
  const API_URL = 'https://script.google.com/macros/s/AKfycbwF9RdfYtKaF7lyDLniwJHpovVsdKV9jNKFlV3-sdeeM_TaMlmub7fMQ-VcjUXvkSyEhQ/exec';
  // ===========================================================

  const LABELS = { o: '○', t: '△', x: '×' };
  const $ = id => document.getElementById(id);
  let idToken = null;
  let state = null;          // { name, survey, answers }
  let queue = Promise.resolve();
  let pending = 0;

  async function api(action, extra) {
    // Content-Type を付けない（text/plain）ことで、CORS のプリフライトを発生させない
    const res = await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify(Object.assign({ action: action, idToken: idToken }, extra || {})),
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    return data;
  }

  function el(tag, props, children) {
    const node = document.createElement(tag);
    Object.assign(node, props || {});
    (children || []).forEach(c => node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c));
    return node;
  }

  function toast(message) {
    const t = $('toast');
    t.textContent = message;
    t.classList.add('show');
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => t.classList.remove('show'), 4000);
  }

  function setStatus() {
    const s = $('status');
    if (pending > 0) { s.textContent = '保存中…'; s.className = 'saving'; }
    else if (setStatus.touched) { s.textContent = '✓ 保存済み'; s.className = 'saved'; }
    else { s.textContent = ''; s.className = ''; }
  }

  function answeredCount() {
    return state.survey.dates.filter(d => state.answers[d.date]).length;
  }

  function updateMeta() {
    const sv = state.survey;
    $('meta').textContent = '';
    $('meta').appendChild(document.createTextNode(`${state.name}さん　${answeredCount()}/${sv.dates.length}日 回答済み`));
    if (sv.deadline) {
      $('meta').appendChild(document.createTextNode('　'));
      $('meta').appendChild(el('span', { className: 'deadline', textContent: `締切 ${sv.deadline}` }));
    }
  }

  function paintRow(row, date) {
    row.querySelectorAll('.choice').forEach(btn => {
      btn.classList.toggle('on', state.answers[date] === btn.dataset.v);
      btn.setAttribute('aria-pressed', state.answers[date] === btn.dataset.v ? 'true' : 'false');
    });
  }

  function choose(date, value, row) {
    if (state.answers[date] === value) return;
    state.answers[date] = value;
    paintRow(row, date);           // 押した瞬間に色を変える
    updateMeta();
    pending++;
    setStatus.touched = true;
    setStatus();
    // 保存は順番に1件ずつ送る（連打しても最後の選択が残るように）
    queue = queue
      .then(() => api('vote', { surveyId: state.survey.id, date: date, value: value }))
      .catch(async err => {
        toast('保存できませんでした：' + err.message);
        try { state.answers = (await api('get')).answers || {}; render(); } catch (e) { /* 表示はそのまま */ }
      })
      .finally(() => { pending--; setStatus(); });
  }

  function render() {
    const main = $('main');
    main.textContent = '';
    const sv = state.survey;

    if (!sv) {
      $('title').textContent = '日程アンケート';
      main.appendChild(el('div', { className: 'card', textContent: 'いま受付中のアンケートはありません。' }));
      main.appendChild(actions(false));
      return;
    }

    $('title').textContent = sv.title;
    if (sv.status !== '受付中') {
      $('meta').textContent = '締め切りました';
      main.appendChild(el('div', { className: 'card', textContent: 'このアンケートは締め切られました。下のボタンで結果を確認できます。' }));
      main.appendChild(actions(false));
      return;
    }

    updateMeta();
    main.appendChild(el('p', { className: 'legend', textContent: '○ 参加できる　△ 未定　× 参加できない（押すとすぐ保存されます）' }));
    sv.dates.forEach(d => {
      const row = el('div', { className: 'row' }, [el('div', { className: 'date w' + d.weekday, textContent: d.label })]);
      ['o', 't', 'x'].forEach(v => {
        const btn = el('button', { className: 'choice ' + v, textContent: LABELS[v], type: 'button' });
        btn.dataset.v = v;
        btn.setAttribute('aria-label', `${d.label} ${LABELS[v]}`);
        btn.addEventListener('click', () => choose(d.date, v, row));
        row.appendChild(btn);
      });
      paintRow(row, d.date);
      main.appendChild(row);
    });
    main.appendChild(actions(true));
  }

  function actions(open) {
    const box = el('div', { className: 'actions' });
    const tallyBox = el('div', { className: 'card' });
    tallyBox.style.display = 'none';

    const tallyBtn = el('button', { className: 'btn', type: 'button', textContent: 'みんなの回答状況を見る' });
    tallyBtn.addEventListener('click', async () => {
      tallyBtn.disabled = true;
      tallyBtn.textContent = '読み込み中…';
      try {
        await queue; // 保存待ちがあれば先に済ませる
        const data = await api('tally');
        tallyBox.textContent = '';
        tallyBox.appendChild(el('pre', { textContent: data.text }));
        tallyBox.style.display = 'block';
      } catch (err) {
        toast(err.message);
      }
      tallyBtn.disabled = false;
      tallyBtn.textContent = '回答状況を更新';
    });

    const closeBtn = el('button', { className: 'btn primary', type: 'button', textContent: '閉じる' });
    closeBtn.addEventListener('click', async () => {
      if (pending > 0) { toast('保存が終わるまでお待ちください…'); await queue; }
      if (liff.isInClient()) liff.closeWindow(); else window.close();
    });

    box.appendChild(tallyBtn);
    box.appendChild(tallyBox);
    if (open) box.appendChild(closeBtn);

    const delBtn = el('button', { className: 'btn danger', type: 'button', textContent: '自分の回答を削除' });
    delBtn.addEventListener('click', async () => {
      if (!delBtn.dataset.confirm) {
        delBtn.dataset.confirm = '1';
        delBtn.textContent = 'もう一度押すと、すべての月の自分の回答を削除します';
        return;
      }
      delBtn.disabled = true;
      try {
        await queue;
        const data = await api('deleteMine');
        state = await api('get');
        render();
        toast(`回答を${data.deleted}件削除しました。`);
      } catch (err) {
        toast(err.message);
        delBtn.disabled = false;
      }
    });
    box.appendChild(delBtn);
    return box;
  }

  function showError(message) {
    $('main').textContent = '';
    $('main').appendChild(el('div', { className: 'card error', textContent: message }));
  }

  async function main() {
    try {
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) {
        liff.login({ redirectUri: location.href });
        return;
      }
      idToken = liff.getIDToken();
      state = await api('get');
      render();
    } catch (err) {
      showError('読み込めませんでした：' + err.message);
    }
  }

  main();
</script>
</body>
</html>
